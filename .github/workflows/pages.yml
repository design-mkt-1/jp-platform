name: Deploy review build to GitHub Pages

# The demo has no server, so the whole app prerenders to static files and Pages hosts them.
# GITHUB_PAGES=true is what switches next.config.ts into export mode and applies the /jp-platform
# base path; without it the build stays the ordinary one used for local checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled: a half-finished deploy would leave the
# client looking at a broken page.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings=0

      - run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Pages serves the directory as-is; .nojekyll stops it from hiding files whose names start
      # with an underscore, which is most of Next's output.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
